controller:
  replicas: 1
  nodeSelector:
    kubernetes.io/arch: arm64
    workload-tier: application
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

server:
  replicas: 1
  nodeSelector:
    kubernetes.io/arch: arm64
    workload-tier: application
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

repoServer:
  replicas: 1
  nodeSelector:
    kubernetes.io/arch: arm64
    workload-tier: application
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  nodeSelector:
    kubernetes.io/arch: arm64
    workload-tier: application
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false
