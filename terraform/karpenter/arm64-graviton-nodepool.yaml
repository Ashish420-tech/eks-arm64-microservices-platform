apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: arm64-graviton
spec:
  template:
    metadata:
      labels:
        workload-tier: application
        architecture: arm64
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: arm64-graviton

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - arm64

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [t4g]
            - t4g
            - c7g
            - m7g

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [small]
            - medium
            - large
            - xlarge

        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-south-1a
            - ap-south-1b
            - ap-south-1c

      expireAfter: 720h
      terminationGracePeriod: 1h

  limits:
    cpu: "8"
    memory: 32Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
