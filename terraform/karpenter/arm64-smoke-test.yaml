apiVersion: v1
kind: Pod
metadata:
  name: karpenter-arm64-smoke
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: arm64
    workload-tier: application
  containers:
    - name: smoke-test
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "echo Karpenter ARM64 test; uname -m; sleep 3600"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
