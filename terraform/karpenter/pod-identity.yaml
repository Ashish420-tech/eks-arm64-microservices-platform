apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: eks-arm64-platform
  region: ap-south-1
iam:
  podIdentityAssociations:
    - namespace: kube-system
      serviceAccountName: karpenter
      createServiceAccount: true
      roleName: eks-arm64-platform-karpenter
      permissionPolicyARNs:
        - arn:aws:iam::924408032261:policy/KarpenterControllerNodeLifecyclePolicy-eks-arm64-platform
        - arn:aws:iam::924408032261:policy/KarpenterControllerIAMIntegrationPolicy-eks-arm64-platform
        - arn:aws:iam::924408032261:policy/KarpenterControllerEKSIntegrationPolicy-eks-arm64-platform
        - arn:aws:iam::924408032261:policy/KarpenterControllerInterruptionPolicy-eks-arm64-platform
        - arn:aws:iam::924408032261:policy/KarpenterControllerZonalShiftPolicy-eks-arm64-platform
        - arn:aws:iam::924408032261:policy/KarpenterControllerResourceDiscoveryPolicy-eks-arm64-platform
